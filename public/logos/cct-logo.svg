<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Background -->
  <rect width="320" height="320" fill="#ffffff" rx="16" />

  <!-- College of Cape Town Typography -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="22" y="142" font-size="24.5" font-weight="800" fill="#000000" letter-spacing="0.5">COLLEGE OF</text>
    <text x="22" y="174" font-size="24.5" font-weight="800" fill="#000000" letter-spacing="0.5">CAPE TOWN</text>
    <text x="120" y="200" font-size="14.5" font-weight="600" fill="#c01e26" letter-spacing="0.4">Inspiring minds</text>
  </g>

  <!-- College of Cape Town Emblem -->
  <g transform="translate(254, 154)">
    <!-- Central Red Ring -->
    <circle cx="0" cy="0" r="23" fill="#d9232a" />
    <circle cx="0" cy="0" r="9.5" fill="#ffffff" />

    <!-- 8 Surrounding Black Orbiting Dots -->
    <!-- 0° (Right / 3 o'clock) -->
    <circle cx="36" cy="0" r="5.2" fill="#000000" />
    <!-- 45° (Bottom Right / 4:30) -->
    <circle cx="25.46" cy="25.46" r="5.2" fill="#000000" />
    <!-- 90° (Bottom / 6 o'clock) -->
    <circle cx="0" cy="36" r="5.2" fill="#000000" />
    <!-- 135° (Bottom Left / 7:30) -->
    <circle cx="-25.46" cy="25.46" r="5.2" fill="#000000" />
    <!-- 180° (Left / 9 o'clock) -->
    <circle cx="-36" cy="0" r="5.2" fill="#000000" />
    <!-- 225° (Top Left / 10:30) -->
    <circle cx="-25.46" cy="-25.46" r="5.2" fill="#000000" />
    <!-- 270° (Top / 12 o'clock) -->
    <circle cx="0" cy="-36" r="5.2" fill="#000000" />
    <!-- 315° (Top Right / 1:30) -->
    <circle cx="25.46" cy="-25.46" r="5.2" fill="#000000" />
  </g>
</svg>
